# DevDigest CI Review — auto-generated by Export Wizard
# ⚠️  The security settings below are required for safe operation.
# ⚠️  Do not add write: to permissions or use pull_request_target.
name: DevDigest Review

on:
  pull_request:
    types:
      - opened
      - synchronize

permissions:
  contents: read
  pull-requests: write

jobs:
  devdigest-review:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Run DevDigest Review
        env:
          OPENROUTER_API_KEY: ${{ secrets.OPENROUTER_API_KEY }}
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          POST_AS: github_review
        run: node .devdigest/runner/index.js

      - name: Upload review results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: devdigest-result
          path: devdigest-result.json
          if-no-files-found: ignore
